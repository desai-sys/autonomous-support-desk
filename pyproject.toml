[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build", "web"]

[tool.ruff.lint]
# Correctness and security, not style: undefined names, unused code, likely bugs
# (bugbear) and insecure patterns (bandit).
select = ["E9", "E7", "F", "B", "S"]
ignore = [
    "B904",   # raise-from inside except: style, not a bug
    "B905",   # zip() strictness: lengths are equal by construction where it is used
    "S101",   # assert is how tests are written
    "S110",   # deliberate best-effort blocks are commented where they occur
    "S603", "S607",  # subprocess with fixed arguments (deploy tooling)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B006", "B011", "E731", "E741"]
"console/**" = ["B008"]   # FastAPI declares dependencies as default arguments
"evals/**" = ["S311"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::pydantic.warnings.PydanticDeprecatedSince20"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
# The codebase writes `x: str = None` for optional arguments.
implicit_optional = true

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web console
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Lint CloudFormation
        run: cfn-lint infra/*.yaml
      - name: Run tests
        run: pytest -q
      - name: Check the agent package builds for AgentCore (linux/arm64)
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import deploy; print(len(deploy.build_agent_package()) // 1_000_000, 'MB')"

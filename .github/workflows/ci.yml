name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web console
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Lint CloudFormation
        run: cfn-lint infra/*.yaml
      - name: Lint Python (correctness and security rules)
        run: ruff check .
      - name: Type-check the platform core
        run: mypy src/core console src/agents src/services src/jobs config.py
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip-audit -r requirements/agent.lock.txt --no-deps --disable-pip
          pip-audit -r requirements/console.txt --no-deps --disable-pip
      - name: Audit web dependencies shipped to the browser
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests with coverage
        run: |
          coverage run --source=src,console -m pytest -q
          coverage report --fail-under=65 | tail -1
      - name: Validate agent evaluation scenarios
        run: python evals/run_evals.py --offline
      - name: Check the agent package builds for AgentCore (linux/arm64)
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import deploy; print(len(deploy.build_agent_package()) // 1_000_000, 'MB')"

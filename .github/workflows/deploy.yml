name: Deploy

# Deploys from a reviewed commit instead of a laptop:
#
#   staging  →  evaluation gate (real models, stubbed AWS)  →  production (needs approval)
#
# One-time setup (docs/DEPLOYMENT.md, "Deploy from GitHub"):
#   1. Deploy infra/github_oidc_role.yaml in each target account; it creates the role
#      this workflow assumes through GitHub's OIDC provider (no stored AWS keys).
#   2. Create GitHub environments "staging" and "production". On "production", add
#      required reviewers. In each environment set the variables:
#        AWS_DEPLOY_ROLE_ARN   the role from step 1
#        AWS_REGION            e.g. us-east-1
#        DEPLOY_ARGS           arguments for scripts/deploy.py, e.g.
#                              staging:    --app-name cloudopsstg --environment staging --nat-gateways 1 --console-tasks 1
#                              production: --app-name cloudops --environment prod --alarm-email ops@example.com
# Until the variables exist the jobs are skipped, so the workflow is safe to merge first.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_evaluation:
        description: Deploy to production without the evaluation gate (emergency fixes only)
        type: boolean
        default: false

permissions:
  id-token: write   # GitHub OIDC → AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: cloudops-deploy-staging
      - name: Deploy to staging
        run: python scripts/deploy.py --region "${{ vars.AWS_REGION }}" ${{ vars.DEPLOY_ARGS }}

  evaluate:
    needs: staging
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ !inputs.skip_evaluation }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: cloudops-evaluate
      # Only Bedrock is called: every AWS tool is a stub and nothing is changed.
      - name: Evaluate the agent with the real models
        run: python evals/run_evals.py --region "${{ vars.AWS_REGION }}" --repeat 2 --gate --min-success "${{ vars.EVAL_MIN_SUCCESS || '0' }}"
      - name: Publish the report
        if: always()
        run: cat evals/results/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-evaluation
          path: evals/results/
          if-no-files-found: ignore

  production:
    needs: [staging, evaluate]
    # Runs after a passing evaluation, or when the evaluation was explicitly skipped.
    if: ${{ always() && needs.staging.result == 'success' && (needs.evaluate.result == 'success' || (needs.evaluate.result == 'skipped' && inputs.skip_evaluation)) }}
    runs-on: ubuntu-latest
    environment: production   # add required reviewers on this environment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: cloudops-deploy-production
      - name: Deploy to production
        run: python scripts/deploy.py --region "${{ vars.AWS_REGION }}" ${{ vars.DEPLOY_ARGS }}
